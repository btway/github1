<script>

  (function () {

    var ua = navigator.userAgent;

    var isSafari =
      /Safari/i.test(ua) &&
      !/Chrome/i.test(ua) &&
      !/Chromium/i.test(ua) &&
      !/CriOS/i.test(ua) &&
      !/Edg/i.test(ua) &&
      !/OPR/i.test(ua) &&
      !/FxiOS/i.test(ua);

    if (isSafari) {
      document.documentElement.classList.add("safari-blocked");
    }

  })();

</script>

    /*
       =========================================================
       SAFARI BLOCK MESSAGE
       =========================================================
    */

    #safari-block {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      background: white;

      z-index: 9999999;

      text-align: center;

      font-family: Arial, sans-serif;

    }


    .safari-blocked #safari-block {

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #safari-block-content {

      max-width: 500px;

      padding: 40px;

    }


    #safari-block-title {

      font-size: 36px;

      font-weight: 600;

      color: #111;

      margin-bottom: 12px;

    }


    #safari-block-message {

      font-size: 16px;

      line-height: 1.6;

      color: #555;

    }


    /*
       =========================================================
       SPLASH
       =========================================================
    */

    #blackbox-splash {

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      background: white;

      z-index: 999999;

      text-align: center;

      font-family: Arial, sans-serif;

      animation:
        blackbox-hide 0.6s ease 40s forwards;

    }


    /*
       =========================================================
       TOP CONTENT
       =========================================================
    */

    #blackbox-content {

      position: absolute;

      top: 30px;

      left: 0;

      right: 0;

    }


    /*
       =========================================================
       TITLE
       =========================================================
    */

    #blackbox-title {

      font-size: 38px;

      font-weight: 600;

      color: #111;

    }


    /*
       =========================================================
       TAGLINE
       =========================================================
    */

    #blackbox-tagline {

      margin-top: 8px;

      font-size: 14px;

      letter-spacing: 3px;

      color: #777;

    }


    /*
       =========================================================
       SPINNER
       =========================================================
    */

    #blackbox-spinner {

      width: 32px;

      height: 32px;

      margin: 28px auto;

      border: 4px solid #eee;

      border-top: 4px solid #222;

      border-radius: 50%;

      animation:
        blackbox-spin 1s linear infinite;

    }


    @keyframes blackbox-spin {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    /*
       =========================================================
       PROGRESS TRACK
       =========================================================
    */

    #blackbox-progress {

      width: 320px;

      max-width: 70vw;

      height: 6px;

      margin: 0 auto;

      background: #eee;

      border-radius: 10px;

      overflow: hidden;

    }


    /*
       =========================================================
       PROGRESS BAR
       =========================================================
    */

    #blackbox-progress-bar {

      width: 0%;

      height: 100%;

      background: #222;

      border-radius: 10px;

      animation:
        blackbox-progress 40s linear forwards;

    }


    @keyframes blackbox-progress {

      from {

        width: 0%;

      }

      to {

        width: 100%;

      }

    }


    /*
       =========================================================
       PERCENTAGE
       =========================================================
    */

    #blackbox-percent {

      margin-top: 10px;

      font-size: 13px;

      color: #777;

      letter-spacing: 0.5px;

    }
