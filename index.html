  <!-- =========================================================
       BLACK BOX, i SPLASH
       ========================================================= -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }


    /* ---------------------------------------------------------
       SPLASH
       --------------------------------------------------------- */

    #blackbox-splash {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      z-index: 999999;

    }


    /* ---------------------------------------------------------
       TOP CONTENT
       --------------------------------------------------------- */

    #blackbox-content {

      position: absolute;

      top: 30px;

      left: 0;
      right: 0;

      text-align: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* ---------------------------------------------------------
       TITLE
       --------------------------------------------------------- */

    #blackbox-title {

      font-size: 38px;

      font-weight: 600;

      color: #111111;

    }


    /* ---------------------------------------------------------
       TAGLINE
       --------------------------------------------------------- */

    #blackbox-tagline {

      margin-top: 8px;

      font-size: 14px;

      letter-spacing: 3px;

      color: #777777;

    }


    /* ---------------------------------------------------------
       SPINNER
       --------------------------------------------------------- */

    #blackbox-spinner {

      width: 32px;

      height: 32px;

      margin: 28px auto 18px auto;

      border: 4px solid #eeeeee;

      border-top: 4px solid #222222;

      border-radius: 50%;

      animation:
        blackbox-spin 1s linear infinite;

    }


    @keyframes blackbox-spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* ---------------------------------------------------------
       PROGRESS BAR
       --------------------------------------------------------- */

    #blackbox-progress {

      width: 320px;

      max-width: 70%;

      height: 6px;

      margin: 0 auto;

      background: #eeeeee;

      border-radius: 10px;

      overflow: hidden;

    }


    #blackbox-progress-bar {

      width: 0%;

      height: 100%;

      background: #222222;

      border-radius: 10px;

    }


    /* ---------------------------------------------------------
       PERCENTAGE
       --------------------------------------------------------- */

    #blackbox-percent {

      margin-top: 10px;

      font-size: 13px;

      color: #777777;

    }


    /* ---------------------------------------------------------
       MESSAGE
       --------------------------------------------------------- */

    #blackbox-message {

      margin-top: 6px;

      font-size: 11px;

      color: #aaaaaa;

    }


    /* ---------------------------------------------------------
       FINISHED
       --------------------------------------------------------- */

    #blackbox-splash.done {

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.5s ease;

      pointer-events: none;

    }

  </style>

</head>


<body>


  <!-- =========================================================
       BLACK BOX, i SPLASH
       ========================================================= -->

  <div id="blackbox-splash">

    <div id="blackbox-content">

      <div id="blackbox-title">
