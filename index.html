       ========================================================= -->

  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

    }


    /* ---------------------------------------------------------
       SPLASH
       --------------------------------------------------------- */

    #blackbox-splash {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      z-index: 999999;

    }


    /* ---------------------------------------------------------
       TOP CONTENT
       --------------------------------------------------------- */

    #blackbox-content {

      position: absolute;

      top: 30px;

      left: 0;
      right: 0;

      text-align: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    /* ---------------------------------------------------------
       TITLE
       --------------------------------------------------------- */

    #blackbox-title {

      font-size: 38px;

      font-weight: 600;

      color: #111111;

    }


    /* ---------------------------------------------------------
       TAGLINE
       --------------------------------------------------------- */

    #blackbox-tagline {

      margin-top: 8px;

      font-size: 14px;

      letter-spacing: 3px;

      color: #777777;

    }


    /* ---------------------------------------------------------
       SPINNER
       --------------------------------------------------------- */

    #blackbox-spinner {

      width: 32px;

      height: 32px;

      margin: 28px auto 18px auto;

      border: 4px solid #eeeeee;

      border-top: 4px solid #222222;

      border-radius: 50%;

      animation:
        blackbox-spin 1s linear infinite;

    }


    @keyframes blackbox-spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }
