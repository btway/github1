<script>

  const splash =
    document.getElementById("blackbox-splash");

  const root =
    document.getElementById("root");


  function checkAppReady() {

    /*
     * Ignore the initial WebR/Shiny bootstrap elements.
     *
     * We wait until an actual Shiny output
     * has appeared.
     */

    const shinyOutput =
      root.querySelector(
        ".shiny-bound-output"
      );

    if (shinyOutput) {

      splash.style.opacity = "0";

      setTimeout(function () {
        splash.remove();
      }, 500);

      observer.disconnect();
    }
  }


  const observer =
    new MutationObserver(function () {

      checkAppReady();

    });


  observer.observe(root, {
    childList: true,
    subtree: true
  });


  /*
   * Also check periodically in case the
   * output already exists before the observer
   * starts watching.
   */

  const readinessCheck =
    setInterval(function () {

      if (!document.body.contains(splash)) {
        clearInterval(readinessCheck);
        return;
      }

      checkAppReady();

    }, 500);

</script>
