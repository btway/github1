<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Black Box,i</title>

    <style>
      /* --------------------------------
         Black Box, i splash screen
         -------------------------------- */

      #blackbox-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        transition: opacity 0.5s ease;
      }

      #blackbox-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .bb-logo {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -1px;
      }

      .bb-tagline {
        margin-top: 8px;
        font-size: 16px;
        opacity: 0.6;
      }

      .bb-spinner {
        width: 34px;
        height: 34px;

        margin-top: 38px;

        border: 4px solid #e5e5e5;
        border-top: 4px solid #222222;

        border-radius: 50%;

        animation: bb-spin 0.9s linear infinite;
      }

      .bb-loading {
        margin-top: 16px;
        font-size: 13px;
        opacity: 0.5;
      }

      @keyframes bb-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>

    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";

      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>

    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />

  </head>

  <body>

    <!-- Black Box, i startup screen -->

    <div id="blackbox-splash">

      <div class="bb-logo">
        Black Box,i
      </div>

      <div class="bb-tagline">
        Simple | Investing
      </div>

      <div class="bb-spinner"></div>

      <div class="bb-loading">
        Loading...
      </div>

    </div>


    <!-- Shiny Live application -->

    <div
      style="height: 100vh; width: 100vw"
      id="root">
    </div>


    <script>

      /*
       * Hide the Black Box, i splash screen
       * when Shiny establishes its connection.
       */

      document.addEventListener("shiny:connected", function () {

        const splash =
          document.getElementById("blackbox-splash");

        if (splash) {

          splash.classList.add("hidden");

          setTimeout(function () {
            splash.remove();
          }, 500);

        }

      });

    </script>

  </body>
</html>
