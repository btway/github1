  <!-- =========================================================
       BLACK BOX, i SPLASH CSS
       ========================================================= -->

  <style>


    /* ---------------------------------------------------------
       BASE
       --------------------------------------------------------- */

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

    }


    /* ---------------------------------------------------------
       WEBR ROOT
       --------------------------------------------------------- */

    #root {

      width: 100vw;

      height: 100vh;

    }


    /* ---------------------------------------------------------
       BLACK BOX, i SPLASH
       --------------------------------------------------------- */

    #blackbox-splash {

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      background: #ffffff;

      z-index: 999999;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

      pointer-events: none;

    }


    /* ---------------------------------------------------------
       SPLASH FINISHED
       --------------------------------------------------------- */

    #blackbox-splash.finished {

      opacity: 0;

      visibility: hidden;

    }


    /* ---------------------------------------------------------
       TOP-ALIGNED LOADING CONTENT
       --------------------------------------------------------- */

    #blackbox-loading {

      position: absolute;

      top: 30px;

      left: 0;

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      box-sizing: border-box;

    }


    /* ---------------------------------------------------------
       TITLE
       --------------------------------------------------------- */

    .blackbox-title {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 38px;

      font-weight: 600;

      letter-spacing: -1.5px;

      line-height: 1;

      color: #111111;

      text-align: center;

    }


    /* ---------------------------------------------------------
       TAGLINE
       --------------------------------------------------------- */

    .blackbox-tagline {

      margin-top: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 400;

      letter-spacing: 3px;

      color: #777777;

      text-align: center;

    }


    /* ---------------------------------------------------------
       SPINNER
       --------------------------------------------------------- */

    .blackbox-spinner {

      width: 34px;

      height: 34px;

      margin-top: 28px;

      margin-bottom: 18px;

      border-radius: 50%;

      border: 3px solid #e8e8e8;

      border-top-color: #222222;

      box-sizing: border-box;

      animation:
        blackbox-spin 0.9s linear infinite;

    }


    @keyframes blackbox-spin {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    /* ---------------------------------------------------------
       PROGRESS BAR CONTAINER
       --------------------------------------------------------- */

    .blackbox-progress-container {

      width: 320px;

      max-width: 70vw;

      text-align: center;

    }


    /* ---------------------------------------------------------
       PROGRESS TRACK
       --------------------------------------------------------- */

    .blackbox-progress-track {

      width: 100%;

      height: 5px;

      background: #eeeeee;

      border-radius: 10px;

      overflow: hidden;

    }


    /* ---------------------------------------------------------
       PROGRESS FILL
       --------------------------------------------------------- */

    .blackbox-progress-fill {

      width: 0%;

      height: 100%;

      background: #222222;

      border-radius: 10px;

    }


    /* ---------------------------------------------------------
       PERCENTAGE
       --------------------------------------------------------- */

    .blackbox-progress-text {

      margin-top: 12px;

      min-height: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;

      color: #777777;

      letter-spacing: 0.5px;

    }


    /* ---------------------------------------------------------
       LOADING TEXT
       --------------------------------------------------------- */

    .blackbox-loading-text {

      margin-top: 7px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 11px;

      color: #aaaaaa;

      letter-spacing: 0.4px;

    }


    /* ---------------------------------------------------------
       SMALL SCREENS
       --------------------------------------------------------- */

    @media (max-width: 500px) {

      #blackbox-loading {

        top: 25px;

      }


      .blackbox-title {

        font-size: 32px;

      }


      .blackbox-tagline {

        font-size: 13px;

        letter-spacing: 2.5px;

      }


      .blackbox-progress-container {

        width: 75vw;

      }

    }


  </style>

</head>
