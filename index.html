<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Black Box, i</title>


  <!-- =========================================================
       MOBILE DETECTION
       ========================================================= -->

  <script>

    (function () {

      const isMobile =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
        .test(navigator.userAgent);

      if (isMobile) {

        document.documentElement.classList.add(
          "blackbox-mobile"
        );

      }

    })();

  </script>


  <!-- =========================================================
       SHINYLIVE / WEBR
       DESKTOP ONLY
       ========================================================= -->

  <script>

    (function () {

      const isMobile =
        document.documentElement.classList.contains(
          "blackbox-mobile"
        );

      if (isMobile) {

        return;

      }


      /*
       * Load the Shinylive service worker
       */

      const script =
        document.createElement("script");

      script.src =
        "./shinylive/load-shinylive-sw.js";

      script.type =
        "module";

      document.head.appendChild(
        script
      );

    })();

  </script>


  <!-- =========================================================
       SHINYLIVE / WEBR APP
       DESKTOP ONLY
       ========================================================= -->

  <script type="module">

    const isMobile =
      document.documentElement.classList.contains(
        "blackbox-mobile"
      );


    if (!isMobile) {

      import(
        "./shinylive/shinylive.js"
      ).then(
        ({ runExportedApp }) => {

          runExportedApp({

            id: "root",

            appEngine: "r",

            relPath: "",

          });

        }
      );

    }

  </script>


  <!-- =========================================================
       SHINYLIVE CSS
       ========================================================= -->

  <link
    rel="stylesheet"
    href="./shinylive/style-resets.css"
  />


  <link
    rel="stylesheet"
    href="./shinylive/shinylive.css"
  />


  <!-- =========================================================
       BLACK BOX, i CSS
       ========================================================= -->

  <style>


    /* ---------------------------------------------------------
       BASE
       --------------------------------------------------------- */

    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

    }


    /* ---------------------------------------------------------
       WEBR ROOT
       --------------------------------------------------------- */

    #root {

      height: 100vh;

      width: 100vw;

    }


    /* ---------------------------------------------------------
       SPLASH SCREEN
       --------------------------------------------------------- */

    #blackbox-splash {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      background: #ffffff;

      z-index: 999999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      box-sizing: border-box;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    #blackbox-splash.finished {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* ---------------------------------------------------------
       TITLE
       --------------------------------------------------------- */

    .blackbox-logo {

      text-align: center;

      margin-bottom: 34px;

    }


    .blackbox-title {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 38px;

      font-weight: 600;

      letter-spacing: -1.5px;

      line-height: 1;

      color: #111111;

    }


    .blackbox-tagline {

      margin-top: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 400;

      letter-spacing: 3px;

      color: #777777;

    }


    /* ---------------------------------------------------------
       SPINNER
       --------------------------------------------------------- */

    .blackbox-spinner {

      width: 34px;

      height: 34px;

      border-radius: 50%;

      border: 3px solid #e8e8e8;

      border-top-color: #222222;

      animation:
        blackbox-spin 0.9s linear infinite;

      margin-bottom: 28px;

      box-sizing: border-box;

    }


    @keyframes blackbox-spin {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }


    /* ---------------------------------------------------------
       PROGRESS BAR
       --------------------------------------------------------- */

    .blackbox-progress-container {

      width: 320px;

      max-width: 70vw;

      text-align: center;

    }


    .blackbox-progress-track {

      width: 100%;

      height: 5px;

      background: #eeeeee;

      border-radius: 10px;

      overflow: hidden;

    }


    .blackbox-progress-fill {

      width: 0%;

      height: 100%;

      background: #222222;

      border-radius: 10px;

    }


    .blackbox-progress-text {

      margin-top: 12px;

      min-height: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;

      color: #777777;

      letter-spacing: 0.5px;

    }


    .blackbox-loading-text {

      margin-top: 7px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 11px;

      color: #aaaaaa;

      letter-spacing: 0.4px;

    }


    /* ---------------------------------------------------------
       MOBILE STOP SCREEN
       --------------------------------------------------------- */

    #blackbox-mobile-message {

      display: none;

    }


    .blackbox-mobile #blackbox-splash {

      display: none;

    }


    .blackbox-mobile #root {

      display: none;

    }


    .blackbox-mobile #blackbox-mobile-message {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      box-sizing: border-box;

      padding: 32px;

      background: #ffffff;

      text-align: center;

      z-index: 999999;

    }


    .blackbox-mobile-title {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 34px;

      font-weight: 600;

      letter-spacing: -1.2px;

      color: #111111;

    }


    .blackbox-mobile-tagline {

      margin-top: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;

      letter-spacing: 2.5px;

      color: #777777;

    }


    .blackbox-mobile-divider {

      width: 50px;

      height: 1px;

      background: #dddddd;

      margin: 34px 0 28px 0;

    }


    .blackbox-mobile-message-text {

      max-width: 360px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 16px;

      line-height: 1.6;

      color: #444444;

    }


    .blackbox-mobile-small {

      margin-top: 16px;

      max-width: 340px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;

      line-height: 1.5;

      color: #999999;

    }


    /* ---------------------------------------------------------
       DESKTOP ONLY
       --------------------------------------------------------- */

    @media (max-width: 500px) {

      .blackbox-title {

        font-size: 32px;

      }

      .blackbox-tagline {

        font-size: 13px;

        letter-spacing: 2.5px;

      }

      .blackbox-progress-container {

        width: 75vw;

      }

    }


  </style>

</head>


<body>


  <!-- =========================================================
       ACTUAL SHINYLIVE / WEBR APP
       DESKTOP ONLY
       ========================================================= -->

  <div
    id="root"
    style="height: 100vh; width: 100vw">
  </div>


  <!-- =========================================================
       BLACK BOX, i SPLASH
       DESKTOP ONLY
       ========================================================= -->

  <div id="blackbox-splash">


    <div class="blackbox-logo">

      <div class="blackbox-title">

        Black Box, i

      </div>


      <div class="blackbox-tagline">

        Simple | Investing

      </div>

    </div>


    <div class="blackbox-spinner"></div>


    <div class="blackbox-progress-container">


      <div class="blackbox-progress-track">

        <div
          id="blackbox-progress-fill"
          class="blackbox-progress-fill">
        </div>

      </div>


      <div
        id="blackbox-progress-text"
        class="blackbox-progress-text">

        0%

      </div>


      <div class="blackbox-loading-text">

        Loading Black Box, i...

      </div>


    </div>


  </div>


  <!-- =========================================================
       MOBILE STOP MESSAGE
       WEBR NEVER INITIALIZES ON MOBILE
       ========================================================= -->

  <div id="blackbox-mobile-message">


    <div class="blackbox-mobile-title">

      Black Box, i

    </div>


    <div class="blackbox-mobile-tagline">

      Simple | Investing

    </div>


    <div class="blackbox-mobile-divider"></div>


    <div class="blackbox-mobile-message-text">

      Black Box, i is currently built
      for desktop computers.

    </div>


    <div class="blackbox-mobile-small">

      Please visit Black Box, i on
      Windows 11 or macOS.

    </div>


  </div>


  <!-- =========================================================
       40-SECOND PROGRESS TIMER
       DESKTOP ONLY
       ========================================================= -->

  <script>

    (function () {


      const isMobile =
        document.documentElement.classList.contains(
          "blackbox-mobile"
        );


      if (isMobile) {

        return;

      }


      const splash =
        document.getElementById(
          "blackbox-splash"
        );


      const fill =
        document.getElementById(
          "blackbox-progress-fill"
        );


      const percentage =
        document.getElementById(
          "blackbox-progress-text"
        );


      /*
       * EXACTLY 40 SECONDS
       */

      const duration =
        40000;


      /*
       * Start timer
       */

      const start =
        performance.now();


      /*
       * Animate progress
       */

      function updateProgress(now) {


        const elapsed =
          now - start;


        let progress =
          (elapsed / duration) * 100;


        progress =
          Math.max(
            0,
            Math.min(
              100,
              progress
            )
          );


        fill.style.width =
          progress + "%";


        percentage.textContent =
          Math.floor(progress) + "%";


        if (elapsed < duration) {


          requestAnimationFrame(
            updateProgress
          );


        }

        else {


          fill.style.width =
            "100%";


          percentage.textContent =
            "100%";


          setTimeout(function () {


            splash.classList.add(
              "finished"
            );


          }, 300);

        }

      }


      requestAnimationFrame(
        updateProgress
      );


    })();

  </script>


</body>

</html>
