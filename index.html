<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Black Box,i</title>

    <style>
      #blackbox-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;
      }

      .bb-logo {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -1px;
      }

      .bb-tagline {
        margin-top: 8px;
        font-size: 16px;
        opacity: 0.6;
      }

      .bb-spinner {
        width: 34px;
        height: 34px;

        margin-top: 38px;

        border: 4px solid #e5e5e5;
        border-top: 4px solid #222222;

        border-radius: 50%;

        animation: bb-spin 0.9s linear infinite;
      }

      .bb-loading {
        margin-top: 16px;
        font-size: 13px;
        opacity: 0.5;
      }

      .bb-notice {
        margin-top: 28px;
        max-width: 320px;

        text-align: center;

        font-size: 12px;
        line-height: 1.6;

        opacity: 0.45;
      }

      @keyframes bb-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>

    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";

      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>

    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />

  </head>

  <body>

    <div id="blackbox-splash">

      <div class="bb-logo">
        Black Box,i
      </div>

      <div class="bb-tagline">
        Simple | Investing
      </div>

      <div class="bb-spinner"></div>

      <div class="bb-loading">
        Loading...
      </div>

      <div class="bb-notice">
        Load time may take up to 30 seconds.<br>
        For enhanced performance, we encourage all users
        to download the desktop version.
      </div>

    </div>


    <div
      style="height: 100vh; width: 100vw"
      id="root">
    </div>


    <!-- Temporary test:
         keep splash visible for 45 seconds -->

    <script>
      setTimeout(function () {

        const splash =
          document.getElementById("blackbox-splash");

        if (splash) {
          splash.style.display = "none";
        }

      }, 45000);
    </script>

  </body>
</html>
