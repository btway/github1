
<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Black Box, i</title>


  <!-- ORIGINAL SHINYLIVE / WEBR -->

  <script
    src="./shinylive/load-shinylive-sw.js"
    type="module">
  </script>

  <script type="module">

    import { runExportedApp }
      from "./shinylive/shinylive.js";

    runExportedApp({
      id: "root",
      appEngine: "r",
      relPath: "",
    });

  </script>


  <!-- ORIGINAL SHINYLIVE CSS -->

  <link
    rel="stylesheet"
    href="./shinylive/style-resets.css"
  />

  <link
    rel="stylesheet"
    href="./shinylive/shinylive.css"
  />


  <!-- VERY SIMPLE SPLASH CSS -->

  <style>

    #blackbox-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 999999;
    }

    #blackbox-content {
      position: absolute;
      top: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #blackbox-title {
      font-size: 38px;
      font-weight: 600;
      color: #111;
    }

    #blackbox-tagline {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #777;
    }

    #blackbox-spinner {
      width: 32px;
      height: 32px;
      margin: 28px auto 18px auto;
      border: 4px solid #eee;
      border-top: 4px solid #222;
      border-radius: 50%;
      animation: blackbox-spin 1s linear infinite;
    }

    @keyframes blackbox-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #blackbox-progress {
      width: 320px;
      max-width: 70%;
      height: 6px;
      margin: 0 auto;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    #blackbox-progress-bar {
      width: 0%;
      height: 100%;
      background: #222;
    }

    #blackbox-percent {
      margin-top: 10px;
      font-size: 13px;
      color: #777;
    }

    #blackbox-message {
      margin-top: 6px;
      font-size: 11px;
      color: #aaa;
    }

    #blackbox-splash.done {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease;
    }

  </style>

</head>


<body>


  <!-- SPLASH -->

  <div id="blackbox-splash">

    <div id="blackbox-content">

      <div id="blackbox-title">
        Black Box, i
      </div>

      <div id="blackbox-tagline">
        Simple | Investing
      </div>

      <div id="blackbox-spinner"></div>

      <div id="blackbox-progress">

        <div id="blackbox-progress-bar"></div>

      </div>

      <div id="blackbox-percent">
        0%
      </div>

      <div id="blackbox-message">
        Loading Black Box, i...
      </div>

    </div>

  </div>


  <!-- ORIGINAL WEBR ROOT -->

  <div
    style="height: 100vh; width: 100vw"
    id="root">
  </div>


  <!-- 40 SECOND VISUAL TIMER -->

  <script>

    const splash =
      document.getElementById(
        "blackbox-splash"
      );

    const bar =
      document.getElementById(
        "blackbox-progress-bar"
      );

    const percent =
      document.getElementById(
        "blackbox-percent"
      );


    const start =
      performance.now();

    const duration =
      40000;


    function update(now) {

      const elapsed =
        now - start;

      let progress =
        (elapsed / duration) * 100;


      if (progress > 100) {
        progress = 100;
      }
