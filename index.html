<script>

  const splash =
    document.getElementById("blackbox-splash");

  const progress =
    document.getElementById("bb-progress");

  const percent =
    document.getElementById("bb-percent");

  const time =
    document.getElementById("bb-time");

  const startTime = Date.now();

  let finished = false;


  /* --------------------------------
     Estimated progress animation
     -------------------------------- */

  const progressTimer = setInterval(function () {

    if (finished) {
      clearInterval(progressTimer);
      return;
    }

    const elapsed =
      (Date.now() - startTime) / 1000;

    /*
     * Slowly approach 90%.
     * We deliberately never claim 100%
     * until the application is actually ready.
     */

    const estimated =
      Math.min(
        90,
        (elapsed / 45) * 90
      );

    progress.style.width =
      estimated + "%";

    percent.textContent =
      Math.floor(estimated) + "%";

    const seconds =
      Math.floor(elapsed);

    time.textContent =
      seconds +
      (seconds === 1 ? " second" : " seconds");

  }, 333);


  /* --------------------------------
     Finish loading
     -------------------------------- */

  function finishLoading() {

    if (finished) return;

    finished = true;

    clearInterval(progressTimer);

    progress.style.width = "100%";
    percent.textContent = "100%";

    const elapsed =
      Math.floor(
        (Date.now() - startTime) / 1000
      );

    time.textContent =
      elapsed +
      (elapsed === 1 ? " second" : " seconds");

    setTimeout(function () {

      splash.style.opacity = "0";

      setTimeout(function () {
        splash.remove();
      }, 500);

    }, 200);

  }


  /* --------------------------------
     Shiny connection
     -------------------------------- */

  document.addEventListener(
    "shiny:connected",
    function () {
      finishLoading();
    }
  );


  /* --------------------------------
     Safety fallback
     -------------------------------- */

  setTimeout(function () {

    if (!finished) {

      finishLoading();

    }

  }, 90000);

</script>
