<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Black Box,i</title>

    <style>
      /* --------------------------------
         Black Box, i splash screen
         -------------------------------- */

      #blackbox-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;

        padding-top: 60px;
        box-sizing: border-box;

        font-family: Arial, Helvetica, sans-serif;

        transition: opacity 0.5s ease;
      }

      /* --------------------------------
         Logo
         -------------------------------- */

      .bb-logo {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -1px;
      }

      /* --------------------------------
         Tagline
         -------------------------------- */

      .bb-tagline {
        margin-top: 8px;

        font-size: 17px;

        opacity: 0.6;
      }

      /* --------------------------------
         Spinner
         -------------------------------- */

      .bb-spinner {
        width: 34px;
        height: 34px;

        margin-top: 38px;

        border: 4px solid #e5e5e5;
        border-top: 4px solid #222222;

        border-radius: 50%;

        animation: bb-spin 0.9s linear infinite;
      }

      @keyframes bb-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --------------------------------
         Loading text
         -------------------------------- */

      .bb-loading {
        margin-top: 18px;

        font-size: 16px;
        font-weight: 500;
      }

      /* --------------------------------
         Progress bar
         -------------------------------- */

      .bb-progress-container {
        width: 300px;
        max-width: 70vw;

        margin-top: 14px;
      }

      .bb-progress-bar {
        width: 100%;
        height: 6px;

        background: #e5e5e5;

        border-radius: 10px;

        overflow: hidden;
      }

      .bb-progress {
        width: 0%;
        height: 100%;

        background: #222222;

        border-radius: 10px;

        transition: width 0.3s linear;
      }

      /* --------------------------------
         Timer
         -------------------------------- */

      .bb-time {
        margin-top: 9px;

        font-size: 13px;

        opacity: 0.5;

        text-align: center;
      }

      /* --------------------------------
         Desktop message
         -------------------------------- */

      .bb-notice {
        margin-top: 34px;

        max-width: 520px;

        text-align: center;

        font-size: 17px;

        line-height: 1.6;

        opacity: 0.55;
      }

      /* --------------------------------
         Mobile message
         -------------------------------- */

      #blackbox-mobile {
        display: none;

        position: fixed;
        inset: 0;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        text-align: center;

        padding: 30px;

        box-sizing: border-box;
      }

      .bb-mobile-content {
        max-width: 420px;
      }

      .bb-mobile-title {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -1px;
      }

      .bb-mobile-tagline {
        margin-top: 8px;

        font-size: 17px;

        opacity: 0.6;
      }

      .bb-mobile-message {
        margin-top: 42px;

        font-size: 18px;

        line-height: 1.6;
      }

      .bb-mobile-note {
        margin-top: 22px;

        font-size: 15px;

        line-height: 1.5;

        opacity: 0.55;
      }

    </style>


    <!-- --------------------------------
         Shiny Live / WebR
         -------------------------------- -->

    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>

    <script type="module">

      /*
       * Detect phones before starting WebR.
       *
       * Desktop:
       *     Start the normal Black Box,i application.
       *
       * Mobile:
       *     Do NOT start WebR.
       *     Show the mobile notice instead.
       */

      const isMobile =
        window.matchMedia("(max-width: 767px)").matches;


      if (!isMobile) {

        const {
          runExportedApp
        } = await import(
          "./shinylive/shinylive.js"
        );

        runExportedApp({
          id: "root",
          appEngine: "r",
          relPath: "",
        });

      }

    </script>


    <link
      rel="stylesheet"
      href="./shinylive/style-resets.css"
    />

    <link
      rel="stylesheet"
      href="./shinylive/shinylive.css"
    />

  </head>


  <body>


    <!-- =================================
         Black Box, i Splash Screen
         ================================= -->

    <div id="blackbox-splash">


      <div class="bb-logo">
        Black Box,i
      </div>


      <div class="bb-tagline">
        Simple | Investing
      </div>


      <div class="bb-spinner"></div>


      <div class="bb-loading">
        Loading...
        <span id="bb-percent">0%</span>
      </div>


      <div class="bb-progress-container">

        <div class="bb-progress-bar">

          <div
            id="bb-progress"
            class="bb-progress">
          </div>

        </div>


        <div
          id="bb-time"
          class="bb-time">

          0 seconds

        </div>

      </div>


      <div class="bb-notice">

        Load time may take up to 60 seconds...

      </div>


    </div>


    <!-- =================================
         Mobile Message
         ================================= -->

    <div id="blackbox-mobile">

      <div class="bb-mobile-content">

        <div class="bb-mobile-title">
          Black Box,i
        </div>


        <div class="bb-mobile-tagline">
          Simple | Investing
        </div>


        <div class="bb-mobile-message">

          <strong>Built for desktop.</strong><br><br>

          Black Box,i is designed for Windows 11 and macOS
          desktop computers.

        </div>


        <div class="bb-mobile-note">

          We look forward to seeing you on desktop.

        </div>

      </div>

    </div>


    <!-- =================================
         Shiny Live Application
         ================================= -->

    <div
      style="height: 100vh; width: 100vw"
      id="root">
    </div>


    <!-- =================================
         Loading Animation
         ================================= -->

    <script>

      /*
       * Mobile visitors never start WebR.
       * Show the mobile message and stop here.
       */

      const isMobile =
        window.matchMedia("(max-width: 767px)").matches;


      if (isMobile) {

        document.getElementById(
          "blackbox-splash"
        ).style.display = "none";


        document.getElementById(
          "blackbox-mobile"
        ).style.display = "flex";


        document.getElementById(
          "root"
        ).style.display = "none";

      }


      /*
       * Desktop loading animation.
       *
       * The actual WebR/Shiny application
       * continues loading normally underneath.
       *
       * This is only a visual loading indicator.
       */

      if (!isMobile) {

        const splash =
          document.getElementById(
            "blackbox-splash"
          );

        const progress =
          document.getElementById(
            "bb-progress"
          );

        const percent =
          document.getElementById(
            "bb-percent"
          );

        const time =
          document.getElementById(
            "bb-time"
          );


        const totalSeconds = 45;

        let elapsed = 0;


        const timer = setInterval(function () {

          elapsed += 0.333;


          if (elapsed > totalSeconds) {
            elapsed = totalSeconds;
          }


          const percentage =
            (elapsed / totalSeconds) * 100;


          progress.style.width =
            percentage + "%";


          percent.textContent =
            Math.floor(percentage) + "%";


          const seconds =
            Math.floor(elapsed);


          time.textContent =
            seconds +
            (
              seconds === 1
                ? " second"
                : " seconds"
            );


        }, 333);


        /*
         * Known-good splash duration.
         *
         * WebR continues loading underneath.
         */

        setTimeout(function () {

          clearInterval(timer);


          progress.style.width = "100%";

          percent.textContent = "100%";

          time.textContent = "45 seconds";


          /*
           * Fade out the splash.
           */

          splash.style.opacity = "0";


          setTimeout(function () {

            splash.remove();

          }, 500);


        }, 45000);

      }

    </script>


  </body>
</html>
