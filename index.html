<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Black Box, i</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .logo {
      text-align: center;
      margin-bottom: 34px;
    }

    .title {
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -1.5px;
      color: #111111;
      line-height: 1.05;
    }

    .tagline {
      margin-top: 9px;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 3px;
      color: #777777;
    }

    /* Spinner */

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e6e6e6;
      border-top: 3px solid #222222;
      border-radius: 50%;

      animation: spin 0.9s linear infinite;

      margin-bottom: 28px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Progress area */

    .progress-container {
      width: min(320px, 70vw);
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 5px;

      background: #eeeeee;
      border-radius: 10px;

      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background: #222222;
      border-radius: 10px;

      transition: width 0.15s linear;
    }

    .progress-text {
      margin-top: 12px;

      font-size: 13px;
      color: #777777;

      letter-spacing: 0.5px;

      min-height: 18px;
    }

    .loading-text {
      margin-top: 7px;

      font-size: 11px;
      color: #aaaaaa;

      letter-spacing: 0.4px;
    }

    @media (max-width: 500px) {

      .title {
        font-size: 32px;
      }

      .tagline {
        font-size: 13px;
        letter-spacing: 2.5px;
      }

      .progress-container {
        width: 75vw;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       BLACK BOX, i SPLASH SCREEN
       ========================================================= -->

  <div id="splash">

    <div class="logo">
      <div class="title">
        Black Box, i
      </div>

      <div class="tagline">
        Simple | Investing
      </div>
    </div>

    <div class="spinner"></div>

    <div class="progress-container">

      <div class="progress-bar">
        <div
          id="progressFill"
          class="progress-fill">
        </div>
      </div>

      <div
        id="progressText"
        class="progress-text">
        0%
      </div>

      <div class="loading-text">
        Loading Black Box, i...
      </div>

    </div>

  </div>


  <!-- =========================================================
       LOADING SCRIPT
       ========================================================= -->

  <script>

    (function () {

      /* -------------------------------------------------------
         SETTINGS
         ------------------------------------------------------- */

      const TOTAL_TIME = 40000; // 40 seconds


      /* -------------------------------------------------------
         ELEMENTS
         ------------------------------------------------------- */

      const splash =
        document.getElementById("splash");

      const progressFill =
        document.getElementById("progressFill");

      const progressText =
        document.getElementById("progressText");


      /* -------------------------------------------------------
         START TIME
         ------------------------------------------------------- */

      const startTime = Date.now();


      /* -------------------------------------------------------
         PROGRESS LOOP
         ------------------------------------------------------- */

      function updateProgress() {

        const elapsed =
          Date.now() - startTime;

        let percentage =
          (elapsed / TOTAL_TIME) * 100;


        /* Never exceed 100 */

        percentage =
          Math.min(percentage, 100);


        /* Update bar */

        progressFill.style.width =
          percentage + "%";


        /* Update number */

        progressText.textContent =
          Math.floor(percentage) + "%";


        /* ---------------------------------------------------
           HOLD SPLASH FOR FULL 40 SECONDS
           --------------------------------------------------- */

        if (elapsed < TOTAL_TIME) {

          requestAnimationFrame(updateProgress);

        } else {

          /* Make absolutely sure we finish at 100% */

          progressFill.style.width = "100%";
          progressText.textContent = "100%";


          /* -------------------------------------------------
             IMPORTANT:
             Do NOT hide the splash early.

             Wait until the browser has painted 100%.
             ------------------------------------------------- */

          setTimeout(function () {

            splash.classList.add("hide");

          }, 250);

        }

      }


      /* -------------------------------------------------------
         START
         ------------------------------------------------------- */

      requestAnimationFrame(updateProgress);

    })();

  </script>

</body>
</html>
