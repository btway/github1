<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Black Box, i</title>


  <script
    src="./shinylive/load-shinylive-sw.js"
    type="module">
  </script>


  <script type="module">

    import { runExportedApp }
      from "./shinylive/shinylive.js";

    runExportedApp({

      id: "root",

      appEngine: "r",

      relPath: "",

    });

  </script>


  <link
    rel="stylesheet"
    href="./shinylive/style-resets.css"
  />


  <link
    rel="stylesheet"
    href="./shinylive/shinylive.css"
  />


  <style>

    /*
       NOTHING HERE CHANGES WEBR.
       THIS IS ONLY THE VISUAL SPLASH.
    */

    #blackbox-splash {

      position: fixed;

      top: 0;

      left: 0;

      width: 100vw;

      height: 100vh;

      background: white;

      z-index: 999999;

      text-align: center;

      font-family: Arial, sans-serif;

    }


    #blackbox-content {

      position: absolute;

      top: 30px;

      left: 0;

      right: 0;

    }


    #blackbox-title {

      font-size: 38px;

      font-weight: 600;

      color: #111;

    }


    #blackbox-tagline {

      margin-top: 8px;

      font-size: 14px;

      letter-spacing: 3px;

      color: #777;

    }


    #blackbox-spinner {

      width: 32px;

      height: 32px;

      margin: 28px auto;

      border: 4px solid #eee;

      border-top: 4px solid #222;

      border-radius: 50%;

      animation: spin 1s linear infinite;

    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    #blackbox-progress {

      width: 320px;

      height: 6px;

      margin: 0 auto;

      background: #eee;

      border-radius: 10px;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ORIGINAL WEBR ROOT
       ===================================================== -->

  <div
    style="height: 100vh; width: 100vw"
    id="root">
  </div>


  <!-- =====================================================
       STATIC SPLASH
       ===================================================== -->

  <div id="blackbox-splash">

    <div id="blackbox-content">

      <div id="blackbox-title">
        Black Box, i
      </div>

      <div id="blackbox-tagline">
        Simple | Investing
      </div>

      <div id="blackbox-spinner"></div>

      <div id="blackbox-progress"></div>

    </div>

  </div>


</body>

</html>
