    /* --------------------------------
       Black Box,i splash screen
       -------------------------------- */

    #blackbox-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;

      width: 100%;
      height: 100%;

      background: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      padding-top: 60px;
      box-sizing: border-box;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      transition:
        opacity 0.5s ease;
    }

       Logo
       -------------------------------- */

    .bb-logo {

      letter-spacing: -1px;

       -------------------------------- */

    .bb-tagline {

      opacity: 0.6;
    }


    /* --------------------------------
       Spinner
       -------------------------------- */

    .bb-spinner {
      width: 34px;
      height: 34px;

      margin-top: 38px;

      border: 4px solid #e5e5e5;

      border-top:
        4px solid #222222;

      border-radius: 50%;

      animation:
        bb-spin 0.9s linear infinite;
    }


    @keyframes bb-spin {

      to {
        transform:
          rotate(360deg);
      }

    }

       Loading text
       -------------------------------- */

    .bb-loading {
      margin-top: 18px;
