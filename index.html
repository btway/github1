<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Black Box,i</title>

    <style>
      /* --------------------------------
         Black Box, i splash screen
         -------------------------------- */

      #blackbox-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;

        width: 100vw;
        height: 100vh;

        background: #ffffff;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        font-family: Arial, Helvetica, sans-serif;

        transition: opacity 0.5s ease;
      }

      /* --------------------------------
         Logo
         -------------------------------- */

      .bb-logo {
        font-size: 42px;
        font-weight: 600;
        letter-spacing: -1px;
      }

      /* --------------------------------
         Tagline
         -------------------------------- */

      .bb-tagline {
        margin-top: 8px;

        font-size: 17px;

        opacity: 0.6;
      }

      /* --------------------------------
         Spinner
         -------------------------------- */

      .bb-spinner {
        width: 34px;
        height: 34px;

        margin-top: 38px;

        border: 4px solid #e5e5e5;
        border-top: 4px solid #222222;

        border-radius: 50%;

        animation: bb-spin 0.9s linear infinite;
      }

      @keyframes bb-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --------------------------------
         Loading text
         -------------------------------- */

      .bb-loading {
        margin-top: 18px;

        font-size: 16px;
        font-weight: 500;
      }

      /* --------------------------------
         Progress bar
         -------------------------------- */

      .bb-progress-container {
        width: 300px;
        max-width: 70vw;

        margin-top: 14px;
      }

      .bb-progress-bar {
        width: 100%;
        height: 6px;

        background: #e5e5e5;

        border-radius: 10px;

        overflow: hidden;
      }

      .bb-progress {
        width: 0%;
        height: 100%;

        background: #222222;

        border-radius: 10px;

        transition: width 0.3s linear;
      }

      /* --------------------------------
         Timer
         -------------------------------- */

      .bb-time {
        margin-top: 9px;

        font-size: 13px;

        opacity: 0.5;

        text-align: center;
      }

      /* --------------------------------
         Desktop message
         -------------------------------- */

      .bb-notice {
        margin-top: 34px;

        max-width: 520px;

        text-align: center;

        font-size: 17px;

        line-height: 1.6;

        opacity: 0.55;
      }

    </style>


    <!-- --------------------------------
         Shiny Live / WebR
         -------------------------------- -->

    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>

    <script type="module">

      import {
        runExportedApp
      } from "./shinylive/shinylive.js";

      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });

    </script>


    <link
      rel="stylesheet"
      href="./shinylive/style-resets.css"
    />

    <link
      rel="stylesheet"
      href="./shinylive/shinylive.css"
    />

  </head>


  <body>


    <!-- =================================
         Black Box, i Splash Screen
         ================================= -->

    <div id="blackbox-splash">


      <div class="bb-logo">
        Black Box,i
      </div>


      <div class="bb-tagline">
        Simple | Investing
      </div>


      <div class="bb-spinner"></div>


      <div class="bb-loading">
        Loading...
        <span id="bb-percent">0%</span>
      </div>


      <div class="bb-progress-container">

        <div class="bb-progress-bar">

          <div
            id="bb-progress"
            class="bb-progress">
          </div>

        </div>


        <div
          id="bb-time"
          class="bb-time">

          0 seconds

        </div>

      </div>


      <div class="bb-notice">

        Load time may take up to 60 seconds or longer.<br>

        For enhanced performance, we encourage all users
        to download the desktop version.

      </div>


    </div>


    <!-- =================================
         Shiny Live Application
         ================================= -->

    <div
      style="height: 100vh; width: 100vw"
      id="root">
    </div>


    <!-- =================================
         Loading Animation
         ================================= -->

    <script>

      const splash =
        document.getElementById(
          "blackbox-splash"
        );

      const progress =
        document.getElementById(
          "bb-progress"
        );

      const percent =
        document.getElementById(
          "bb-percent"
        );

      const time =
        document.getElementById(
          "bb-time"
        );


      /*
       * The actual WebR/Shiny application
       * continues loading normally underneath.
       *
       * This is only a visual loading indicator.
       */

      const totalSeconds = 45;

      let elapsed = 0;


      const timer = setInterval(function () {

        elapsed += 0.333;


        if (elapsed > totalSeconds) {
          elapsed = totalSeconds;
        }


        const percentage =
          (elapsed / totalSeconds) * 100;


        progress.style.width =
          percentage + "%";


        percent.textContent =
          Math.floor(percentage) + "%";


        const seconds =
          Math.floor(elapsed);


        time.textContent =
          seconds +
          (
            seconds === 1
              ? " second"
              : " seconds"
          );


      }, 333);


      /*
       * Known-good splash duration.
       *
       * WebR continues loading underneath.
       */

      setTimeout(function () {

        clearInterval(timer);


        progress.style.width = "100%";

        percent.textContent = "100%";

        time.textContent = "45 seconds";


        /*
         * Fade out the splash.
         */

        splash.style.opacity = "0";


        setTimeout(function () {

          splash.remove();

        }, 500);


      }, 45000);

    </script>


  </body>
</html>
