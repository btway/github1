<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Black Box, i</title>


  <!-- =========================================================
       SHINYLIVE / WEBR
       KEEP THIS EXACTLY AS THE STOCK VERSION
       ========================================================= -->

  <script
    src="./shinylive/load-shinylive-sw.js"
    type="module">
  </script>


  <script type="module">

    import {
      runExportedApp
    } from "./shinylive/shinylive.js";


    runExportedApp({

      id: "root",

      appEngine: "r",

      relPath: "",

    });

  </script>


  <link
    rel="stylesheet"
    href="./shinylive/style-resets.css"
  />


  <link
    rel="stylesheet"
    href="./shinylive/shinylive.css"
  />


  <!-- =========================================================
       SPLASH SCREEN CSS
       ========================================================= -->

  <style>

    #blackbox-splash {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #ffffff;

      z-index: 999999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      box-sizing: border-box;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    #blackbox-splash.finished {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* ---------------------------------------------------------
       TITLE
       --------------------------------------------------------- */

    .blackbox-logo {

      text-align: center;

      margin-bottom: 34px;

    }


    .blackbox-title {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 38px;

      font-weight: 600;

      letter-spacing: -1.5px;

      line-height: 1;

      color: #111111;

    }


    .blackbox-tagline {

      margin-top: 10px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 400;

      letter-spacing: 3px;

      color: #777777;

    }


    /* ---------------------------------------------------------
       SPINNER
       --------------------------------------------------------- */

    .blackbox-spinner {

      width: 34px;

      height: 34px;

      border-radius: 50%;

      border: 3px solid #e8e8e8;

      border-top-color: #222222;

      animation:
        blackbox-spin 0.9s linear infinite;

      margin-bottom: 28px;

      box-sizing: border-box;

    }


    @keyframes blackbox-spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* ---------------------------------------------------------
       PROGRESS BAR
       --------------------------------------------------------- */

    .blackbox-progress-container {

      width: 320px;

      max-width: 70vw;

      text-align: center;

    }


    .blackbox-progress-track {

      width: 100%;

      height: 5px;

      background: #eeeeee;

      border-radius: 10px;

      overflow: hidden;

    }


    .blackbox-progress-fill {

      width: 0%;

      height: 100%;

      background: #222222;

      border-radius: 10px;

    }


    .blackbox-progress-text {

      margin-top: 12px;

      min-height: 18px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 13px;

      color: #777777;

      letter-spacing: 0.5px;

    }


    .blackbox-loading-text {

      margin-top: 7px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 11px;

      color: #aaaaaa;

      letter-spacing: 0.4px;

    }


    /* ---------------------------------------------------------
       MOBILE
       --------------------------------------------------------- */

    @media (max-width: 500px) {

      .blackbox-title {

        font-size: 32px;

      }

      .blackbox-tagline {

        font-size: 13px;

        letter-spacing: 2.5px;

      }

      .blackbox-progress-container {

        width: 75vw;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       ACTUAL SHINYLIVE / WEBR APP
       THIS IS THE STOCK ROOT
       ========================================================= -->

  <div
    style="height: 100vh; width: 100vw"
    id="root">
  </div>


  <!-- =========================================================
       BLACK BOX, i SPLASH
       SITS ABOVE THE WEBR APP
       ========================================================= -->

  <div id="blackbox-splash">


    <div class="blackbox-logo">

      <div class="blackbox-title">
        Black Box, i
      </div>

      <div class="blackbox-tagline">
        Simple | Investing
      </div>

    </div>


    <div class="blackbox-spinner"></div>


    <div class="blackbox-progress-container">


      <div class="blackbox-progress-track">

        <div
          id="blackbox-progress-fill"
          class="blackbox-progress-fill">
        </div>

      </div>


      <div
        id="blackbox-progress-text"
        class="blackbox-progress-text">

        0%

      </div>


      <div class="blackbox-loading-text">

        Loading Black Box, i...

      </div>


    </div>


  </div>


  <!-- =========================================================
       40-SECOND PROGRESS TIMER
       ========================================================= -->

  <script>

    (function () {


      const splash =
        document.getElementById(
          "blackbox-splash"
        );


      const fill =
        document.getElementById(
          "blackbox-progress-fill"
        );


      const percentage =
        document.getElementById(
          "blackbox-progress-text"
        );


      /*
       * EXACTLY 40 SECONDS
       */

      const duration = 40000;


      /*
       * Start timer
       */

      const start =
        performance.now();


      /*
       * Animate progress
       */

      function updateProgress(now) {


        const elapsed =
          now - start;


        let progress =
          (elapsed / duration) * 100;


        progress =
          Math.max(
            0,
            Math.min(
              100,
              progress
            )
          );


        /*
         * Update bar
         */

        fill.style.width =
          progress + "%";


        /*
         * Update percentage
         */

        percentage.textContent =
          Math.floor(progress) + "%";


        /*
         * Continue until exactly 40 seconds
         */

        if (elapsed < duration) {

          requestAnimationFrame(
            updateProgress
          );

        }

        else {


          /*
           * Force final state
           */

          fill.style.width = "100%";

          percentage.textContent = "100%";


          /*
           * Let the user actually see 100%
           */

          setTimeout(function () {


            /*
             * Remove splash only.
             *
             * WebR/Shiny remains running
             * underneath.
             */

            splash.classList.add(
              "finished"
            );


          }, 300);

        }

      }


      /*
       * Start animation
       */

      requestAnimationFrame(
        updateProgress
      );


    })();

  </script>


</body>

</html>
